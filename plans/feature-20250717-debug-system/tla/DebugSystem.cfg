CONSTANTS
    MaxEvents = 10
    MaxAgents = 3
    MaxConversations = 2
    DebugLevels = {"TRACE", "DEBUG", "INFO", "WARN", "ERROR", "CRITICAL"}
    EventTypes = {"INIT", "RECEIVE_MESSAGE", "PROCESS", "RESPOND", "ERROR", "STATE_CHANGE"}
    AgentIds = {"agent1", "agent2", "agent3"}
    ConversationIds = {"conv1", "conv2"}

SPECIFICATION Spec

INVARIANTS
    TypeInvariant
    EventsChronologicalOrder
    NoDuplicateEvents
    AgentStatesConsistent
    ConversationEventsGrouped
    BoundedMemory
    NoDeadlock

PROPERTIES
    EventuallyProcessed
    EventuallyRecovers
    MetricsEventuallyRecorded
